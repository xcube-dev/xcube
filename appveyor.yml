version: '{build}'

image:
  - Ubuntu2204
  - macos

configuration: Release

platform:
  - x64

environment:
  PIXI_VERSION: v0.77.1

# Do not build feature branch with open Pull Requests.
# Note that a feature branch build may still occur on the first push to
# the branch -- see
# https://help.appveyor.com/discussions/questions/18437-skip_branch_with_pr-setting-doesnt-work
skip_branch_with_pr: true

install:
  - curl -fsSL https://pixi.sh/install.sh -o pixi-install.sh
  - sh pixi-install.sh

build_script:
  - export PATH="$HOME/.pixi/bin:$PATH"

  # Diagnostics
  - echo $PLATFORM
  - echo $APPVEYOR_BUILD_WORKER_IMAGE
  - echo $APPVEYOR_BUILD_FOLDER
  - uname -a
  - pwd
  - ls

  # Install the locked Pixi environment. xcube is installed in editable mode by Pixi.
  - cd $APPVEYOR_BUILD_FOLDER
  - pixi install --locked

  # Print some diagnostics (useful for debugging)
  - git status
  - pixi info
  - pixi list
  - pixi run -x xcube --version
  - pixi run -x python -c "from xcube import __version__; print(f'xcube version {__version__}')"

  # Run the test suite
  - pixi run -x pytest -v --cov=xcube

  # Setting NUMBA_DISABLE_JIT=1 makes unit tests way too slow, so we accept less code coverage here
  # - export NUMBA_DISABLE_JIT=1
  # - py.test -v --cov=xcube

