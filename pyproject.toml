[build-system]
requires = ["setuptools >= 61.2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xcube" # PYPI RENAME THIS LINE (do not remove this comment, see #1010) 
dynamic = ["version", "readme"]
authors = [
  {name = "xcube Development Team"}
]
description = """\
  xcube is a Python package for generating and exploiting \
  data cubes powered by xarray, dask, and zarr. \
  """
keywords = [
  "analysis ready data", "data science",
  "datacube", "xarray", "zarr"
]
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
  "botocore>=1.34.51",
  "cftime>=1.6.3",
  "click>=8.0",
  "cmocean>=2.0",
  "chartlets>=0.1.3",
  "cryptography",  # pyjwt optional dependency; see PR #1199
  "dask>=2021.6",
  "dask-image>=0.6",
  "deprecated>=1.2",
  "distributed>=2021.6",
  "fiona>=1.8",
  "fsspec>=2021.6",
  "gdal>=3.0",
  "geopandas>=0.8",
  "jdcal>=1.4",
  "jsonschema>=3.2",
  "mashumaro",
  "matplotlib>=3.8.3,<4",
  "netcdf4>=1.5",
  "numba>=0.52",
  "numcodecs>=0.12.1",
  "numpy>=1.16",
  "pandas>=1.3,<3",
  "pillow>=6.0",
  "pyjwt>=2.5",
  "pyproj>=3.0",
  "pyyaml>=5.4",
  "rasterio>=1.2",
  "requests>=2.25",
  "rfc3339-validator>=0.1",
  "rioxarray>=0.11",
  "s3fs>=2021.6",
  "setuptools>=41.0",
  "shapely>=1.6",
  "tabulate>=0.9",
  "tornado>=6.0",
  "urllib3>=1.26",
  "xarray>=2024.7",
  "zarr>=2.11,<3"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Operating System :: Unix",
  "Operating System :: MacOS",
]

# entry point xcube's CLI
[project.scripts]
xcube = "xcube.cli.main:main"

# entry point xcube's default extensions
[project.entry-points.xcube_plugins]
xcube = "xcube.plugin:init_plugin"

[tool.setuptools.package-data]
"xcube.webapi.meta" = [
    "data/openapi.html",
]
"xcube.webapi.viewer" = [
    "dist/*", "dist/**/*",
]

[tool.setuptools.dynamic]
version = {attr = "xcube.__version__"}
readme = {file = "README.md", content-type = "text/markdown"}

[tool.setuptools.packages.find]
exclude = [
  "test*",
  "doc*"
]

[project.optional-dependencies]
dev = [
  "flake8>=3.7",
  "isort>=6",
  "moto>=4",
  "pytest>=4.4",
  "pytest-cov>=2.6",
  "pytz",  # for test/util/test_timeindex.py
  "requests-mock>=1.8",
  "ruff>=0.9",
  "werkzeug"
]

[project.urls]
Documentation = "https://xcube.readthedocs.io/en/latest/"
Source = "https://github.com/xcube-dev/xcube"
Download = "https://pypi.org/project/xcube-core/#files"
Tracker = "https://github.com/xcube-dev/xcube/issues"
"Release notes" = "https://github.com/xcube-dev/xcube/releases"
Changelog = "https://github.com/xcube-dev/xcube/blob/main/CHANGES.md"

# --- Pixi configuration

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-64"]

[tool.pixi.pypi-dependencies]
xcube = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
xcube = { features = ["xcube"], no-default-feature = true }

[tool.pixi.feature.xcube]
channels = ["conda-forge"]

[tool.pixi.feature.xcube.dependencies]
python = ">=3.10"
affine = ">=2.2"
botocore = ">=1.34.51"
cftime = ">=1.6.3"
click = ">=8.2.0"
cmocean = ">=2.0"
cryptography = "*"
dask = ">=2024.8"
dask-image = ">=0.6"
deprecated = ">=1.2"
distributed = ">=2021.6"
fiona = ">=1.8"
fsspec = ">=2021.6"
gdal = ">=3.0"
geopandas = ">=0.8"
jdcal = ">=1.4"
jsonschema = ">=3.2"
libgdal-jp2openjpeg = "*"
libjxl = "<=0.11.2"
mashumaro = "*"
matplotlib-base = ">=3.8.3,<4"
netcdf4 = ">=1.5"
numba = ">=0.52"
numcodecs = ">=0.12.1"
numpy = ">=1.16"
pandas = ">=1.3,<3"
pillow = ">=6.0"
pyjwt = ">=2.5"
pyproj = ">=3.0"
pyyaml = ">=5.4"
rasterio = ">=1.2"
requests = ">=2.25"
rfc3339-validator = ">=0.1"
rioxarray = ">=0.11"
s3fs = ">=2021.6"
setuptools = ">=41.0"
shapely = ">=1.6"
tabulate = ">=0.9"
tornado = ">=6.0,<6.5"
urllib3 = ">=2.0"
xarray = ">=2024.7"
zarr = ">=2.11,<3"
altair = "*"
chartlets = ">=0.1.3"
flake8 = ">=3.7"
isort = ">=6"
kerchunk = "*"
moto = ">=4"
pytest = ">=4.4"
pytest-cov = ">=2.6"
pytz = "*"
requests-mock = ">=1.8"
ruff = ">=0.9"
werkzeug = "*"

# pixi run ...

[tool.pixi.tasks]
# Top-level tasks
doc-serve = "mkdocs serve"
doc-build = "mkdocs build"
jl = "jupyter-lab"
tests = "pytest tests"
# The following are helpers for composite tasks that use `depends-on`
format-with-isort = "isort src tests"
format-with-ruff = "ruff format src tests"
check-with-ruff = "ruff check src"
check-with-mypy = "mypy src"
cov-base = "pytest --cov src/sen4cap_client --cov-report= --cov-append tests"
cov-report-html = "coverage html -d .cov-report && coverage report"
cov-report-xml = "coverage xml -o coverage.xml && coverage report"

# pixi run format

[tool.pixi.tasks.format]
depends-on = ["format-with-isort", "format-with-ruff"]

# pixi run checks

[tool.pixi.tasks.checks]
depends-on = ["check-with-ruff", "check-with-mypy"]

# pixi run coverage

[tool.pixi.tasks.coverage]
depends-on = ["cov-base", "cov-report-html"]

# pixi run coverage-ci

[tool.pixi.tasks.coverage-ci]
depends-on = ["cov-base", "cov-report-xml"]
