# Read-the-Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: "ubuntu-24.04"
  tools:
    python: "mambaforge-23.11"
  jobs:
    post_checkout:
      - curl -fsSL https://pixi.sh/install.sh -o /tmp/install-pixi.sh
      - PIXI_VERSION=v0.77.1 sh /tmp/install-pixi.sh
      - $HOME/.pixi/bin/pixi project export conda-environment --from-lock-file --environment docs rtd-environment.yml
    install:
      - python -m pip install --no-deps .

sphinx:
  configuration: docs/source/conf.py

conda:
  environment: rtd-environment.yml

formats: all
